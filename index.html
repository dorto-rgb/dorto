      property="og:description"
      content="Современные сайты и веб-приложения для бизнеса. Продуманный дизайн, удобный интерфейс и функциональность, которая помогает вашему проекту расти."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Создаю сайты, которые превращают посетителей в клиентов" />

      content="Современные сайты и веб-приложения для бизнеса. Продуманный дизайн, удобный интерфейс и функциональность для роста проекта."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <meta name="robots" content="index, follow" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "name": "appjet — веб-разработка",
            "description": "Разработка современных сайтов и веб-приложений для бизнеса: лендинги, корпоративные сайты, интернет-магазины, веб-приложения, Telegram-боты и редизайн.",
            "areaServed": "Worldwide",
            "serviceType": [
              "Разработка лендинга",
              "Разработка корпоративного сайта",
              "Разработка интернет-магазина",
              "Разработка веб-приложения",
              "Разработка Telegram-бота",
              "Редизайн сайта"
            ]
          },
          {
            "@type": "WebSite",
            "name": "appjet — портфолио веб-разработчика",
            "inLanguage": "ru-RU"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Сколько времени занимает разработка сайта?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Срок зависит от объёма: лендинг обычно занимает 1–2 недели, корпоративный сайт или магазин — от 3 до 6 недель, веб-приложения — индивидуально. Точный срок фиксируется после обсуждения задачи."
                }
              },
              {
                "@type": "Question",
                "name": "Можно ли заказать сайт с индивидуальным дизайном?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Да. Дизайн разрабатывается под конкретный проект: учитываются ниша, аудитория и задачи бизнеса, а не используются готовые шаблоны."
                }
              },
              {
                "@type": "Question",
                "name": "Будет ли сайт работать на телефонах?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Да, каждый проект адаптируется под смартфоны, планшеты, ноутбуки и большие экраны — вёрстка проверяется на разных размерах экрана."
                }
              },
              {
                "@type": "Question",
                "name": "Можно ли добавить новые функции после запуска?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Да. Сайт можно развивать поэтапно — добавлять разделы, формы, интеграции и новые функции по мере роста задач."
                }
              },
              {
                "@type": "Question",
                "name": "Предоставляется ли помощь после завершения проекта?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Да, после запуска я помогаю с вопросами по работе сайта, а также с доработками и обновлениями."
                }
              },
              {
                "@type": "Question",
                "name": "Как формируется стоимость разработки?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Стоимость зависит от сложности проекта, количества страниц и необходимого функционала. Точная сумма обсуждается после уточнения задачи."
                }
              },
              {
                "@type": "Question",
                "name": "Можно ли заказать Telegram-бота?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Да, разрабатываю ботов с меню, командами, автоматизацией и интеграциями для задач бизнеса."
                }
              },
              {
                "@type": "Question",
                "name": "Как происходит передача готового проекта?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Готовый сайт передаётся с доступом к коду и настройкам, с публикацией на вашем домене и короткими пояснениями по управлению."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
